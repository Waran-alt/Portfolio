# Local / emergency VPS build for the public landing (Next.js only).
#
# Hostinger production (GHCR pull, no VPS build): docker-compose.hostinger.yml
# Deploy: manual workflow .github/workflows/deploy-hostinger.yml — see documentation/DEPLOYMENT-HOSTINGER.md
#
# Intended use:
# - Local prod-like run or SSH fallback: `docker compose -f docker-compose.deploy.yml up -d --build`
# - VPS nginx routes https://focus-on-pixel.com → 127.0.0.1:3000
#
# Notes:
# - Binds to 127.0.0.1 so the app is not public without a reverse proxy.
# - No Postgres, backend, or JWT secrets for this deploy mode.
# - CPU/RAM caps keep the landing from saturating a small VPS shared with other stacks.
# - One-time VPS tuning: sudo bash scripts/hostinger-vps-docker-tuning.sh
name: portfolio-landing

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://focus-on-pixel.com}
    image: portfolio-frontend:latest
    pull_policy: never
    container_name: portfolio_frontend_deploy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NGINX_URL: http://127.0.0.1
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://focus-on-pixel.com}
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
