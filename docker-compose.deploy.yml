# Git-deploy friendly compose file for the public landing (Next.js only).
#
# Intended use:
# - Push to main → Hostinger / VPS runs `docker compose -f docker-compose.deploy.yml up -d --build`
# - VPS nginx routes https://focus-on-pixel.com → 127.0.0.1:3000
#
# Notes:
# - Binds to 127.0.0.1 so the app is not public without a reverse proxy.
# - No Postgres, backend, or JWT secrets for this deploy mode.
name: portfolio-landing

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://focus-on-pixel.com}
    image: portfolio-frontend:latest
    pull_policy: never
    container_name: portfolio_frontend_deploy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NGINX_URL: http://127.0.0.1
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://focus-on-pixel.com}
    ports:
      - "127.0.0.1:3000:3000"
