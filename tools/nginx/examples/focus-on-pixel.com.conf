# Minimal Nginx vhost for focus-on-pixel.com (TLS termination on the proxy).
# Routes:
# - https://focus-on-pixel.com/      -> portfolio frontend (loopback)
# - https://focus-on-pixel.com/api/  -> portfolio backend  (loopback)
#
# Assumptions:
# - Your containers bind to 127.0.0.1 (see docker-compose.deploy.yml).
# - You manage TLS certs on the proxy (Certbot or provider).
# - Update ports to match your deploy env (e.g. FRONTEND_PORT=3000, BACKEND_PORT=4000).

upstream portfolio_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream portfolio_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name focus-on-pixel.com www.focus-on-pixel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name focus-on-pixel.com www.focus-on-pixel.com;

    ssl_certificate     /etc/letsencrypt/live/focus-on-pixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focus-on-pixel.com/privkey.pem;

    # If you use Certbot's managed snippets, you can replace the above with:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Health check (optional)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Backend API
    location /api/ {
        proxy_pass http://portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://portfolio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (if ever needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

