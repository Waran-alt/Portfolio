# Minimal Nginx vhost for focus-on-pixel.com (TLS termination on the proxy).
# Routes:
# - https://focus-on-pixel.com/ -> portfolio frontend (loopback)
#
# Assumptions:
# - The landing container binds to 127.0.0.1 (see docker-compose.deploy.yml).
# - You manage TLS certs on the proxy (Certbot or provider).
# - Update the upstream port to match FRONTEND_PORT (default 3000).

upstream portfolio_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name focus-on-pixel.com www.focus-on-pixel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name focus-on-pixel.com www.focus-on-pixel.com;

    ssl_certificate     /etc/letsencrypt/live/focus-on-pixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focus-on-pixel.com/privkey.pem;

    # If you use Certbot's managed snippets, you can replace the above with:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://portfolio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
