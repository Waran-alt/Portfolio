# CI gate before manual Hostinger deploy: install, validate compose, build landing, audit.
# Full format/lint (code-quality:check) is not enforced here — repo-wide Prettier/ESLint debt (~200+ files).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and Yarn
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Hostinger compose
        run: |
          FRONTEND_IMAGE=ghcr.io/example/portfolio-frontend \
          FRONTEND_IMAGE_TAG=ci \
          docker compose -f docker-compose.hostinger.yml config --quiet

      - name: Build frontend (Next.js landing)
        timeout-minutes: 15
        run: yarn build:frontend
        env:
          NEXT_PUBLIC_FRONTEND_URL: https://focus-on-pixel.com
          NEXT_PUBLIC_API_URL: ''

      - name: Audit dependencies
        run: yarn npm audit --all --severity high
        continue-on-error: true
